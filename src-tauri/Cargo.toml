[package]
name = "schedulepin"
version = "0.1.0"
description = "把今天真正重要的事钉在桌面上"
authors = ["SchedulePin"]
edition = "2021"

[lib]
name = "schedulepin_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
