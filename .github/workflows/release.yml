name: Build Helper Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-installer:
    name: Build and verify Windows installer
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Report runner build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustc --version
          cargo --version

          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $isccPath = if ($isccCommand) { $isccCommand.Source } else { $null }
          if (-not $isccPath) {
            foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              if (-not $root) { continue }
              $candidate = Join-Path $root "Inno Setup 6\ISCC.exe"
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                $isccPath = $candidate
                break
              }
            }
          }
          if (-not $isccPath) {
            throw "ISCC.exe was not found on the GitHub runner."
          }
          $isccVersion = (Get-Item -LiteralPath $isccPath).VersionInfo.ProductVersion
          Write-Host "Inno Setup compiler: $isccPath"
          Write-Host "Inno Setup version: $isccVersion"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package.json version $packageVersion."
          }

      - name: Build helper installer
        shell: pwsh
        run: ./scripts/release-local.ps1

      - name: Smoke test installer
        shell: pwsh
        run: |
          function Wait-ForSingleProcess {
            param(
              [Parameter(Mandatory = $true)]
              [System.Diagnostics.Process]$Process,
              [Parameter(Mandatory = $true)]
              [string]$Name,
              [int]$TimeoutSeconds = 120
            )

            if (-not $Process.WaitForExit($TimeoutSeconds * 1000)) {
              Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
              throw "$Name timed out after $TimeoutSeconds seconds."
            }
            $Process.Refresh()
            return $Process.ExitCode
          }

          $setupPath = (Resolve-Path "release/local/SchedulePin-Helper-Setup.exe").Path
          $setupLog = Join-Path $env:RUNNER_TEMP "schedulepin-setup.log"
          $setup = Start-Process -FilePath $setupPath -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/LOG=$setupLog"
          ) -PassThru
          $setupExitCode = Wait-ForSingleProcess -Process $setup -Name "Installer"
          if ($setupExitCode -ne 0) {
            Get-Content $setupLog -ErrorAction SilentlyContinue
            throw "Installer exited with code $setupExitCode."
          }

          $installDir = Join-Path $env:LOCALAPPDATA "Programs\SchedulePin Helper"
          $helperPath = Join-Path $installDir "schedulepin-helper.exe"
          $manifestPath = Join-Path $installDir "com.schedulepin.helper.json"
          if (-not (Test-Path -LiteralPath $helperPath -PathType Leaf)) {
            throw "Installed helper was not found."
          }
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Installed Native Messaging manifest was not found."
          }

          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          if ($manifest.path -ne "schedulepin-helper.exe") {
            throw "Native Messaging manifest does not use the installed relative helper path."
          }
          $expectedOrigin = "chrome-extension://dhlpgdmpmcenijihielpijhmjnjmcboi/"
          if ($manifest.allowed_origins.Count -ne 1 -or $manifest.allowed_origins[0] -ne $expectedOrigin) {
            throw "Native Messaging manifest contains an unexpected allowed origin."
          }

          $hostName = "com.schedulepin.helper"
          $chromeHost = (Get-Item "HKCU:\Software\Google\Chrome\NativeMessagingHosts\$hostName").GetValue("")
          $edgeHost = (Get-Item "HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\$hostName").GetValue("")
          if ($chromeHost -ne $manifestPath -or $edgeHost -ne $manifestPath) {
            throw "Native Messaging registry entries do not point to the installed manifest."
          }
          $runValue = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").SchedulePinHelper
          if ($runValue -ne "`"$helperPath`" --daemon") {
            throw "The helper startup entry is missing or incorrect."
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -PassThru
          $uninstallExitCode = Wait-ForSingleProcess -Process $uninstall -Name "Uninstaller"
          if ($uninstallExitCode -ne 0) {
            throw "Uninstaller exited with code $uninstallExitCode."
          }
          if (Test-Path "HKCU:\Software\Google\Chrome\NativeMessagingHosts\$hostName") {
            throw "Chrome Native Messaging registration remained after uninstall."
          }
          if (Test-Path "HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\$hostName") {
            throw "Edge Native Messaging registration remained after uninstall."
          }
          $runValueAfterUninstall = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue).SchedulePinHelper
          if ($runValueAfterUninstall) {
            throw "The helper startup entry remained after uninstall."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchedulePin-Helper-Setup
          path: release/local/SchedulePin-Helper-Setup.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@v4
        with:
          name: SchedulePin-Helper-Setup
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/SchedulePin-Helper-Setup.exe --generate-notes --title "SchedulePin ${{ github.ref_name }}"
