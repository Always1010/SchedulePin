[package]
name = "schedulepin-helper"
version = "0.3.0"
description = "SchedulePin 可选 Windows 壁纸助手"
authors = ["SchedulePin"]
edition = "2021"

[lib]
name = "schedulepin_helper"
crate-type = ["rlib"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
resvg = { version = "0.45", features = ["text", "system-fonts", "raster-images"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell"
] }

[dev-dependencies]
tempfile = "3"
